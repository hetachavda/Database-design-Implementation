<svg width="1200" height="770" viewBox="0 0 1200 770" xmlns="http://www.w3.org/2000/svg"
     font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#25507a"/>
      <stop offset="100%" stop-color="#4479A1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="770" fill="#f9f9f7"/>

  <!-- header -->
  <rect x="0" y="0" width="1200" height="86" fill="url(#head)"/>
  <text x="30" y="42" font-size="26" font-weight="700" fill="#ffffff">Car Dealership Database Dashboard</text>
  <text x="30" y="70" font-size="15" fill="#d5e6f5">MySQL relational schema · 9 entities · normalized to 3NF</text>

  <!-- KPI tiles -->
  <rect x="30" y="110" width="360" height="110" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
  <rect x="30" y="110" width="6" height="110" rx="3" fill="#2a78d6"/>
  <text x="58" y="148" font-size="14" font-weight="600" fill="#898781" letter-spacing="1">ENTITIES / TABLES</text>
  <text x="56" y="198" font-size="46" font-weight="700" fill="#0b0b0b">9</text>

  <rect x="420" y="110" width="360" height="110" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
  <rect x="420" y="110" width="6" height="110" rx="3" fill="#1baf7a"/>
  <text x="448" y="148" font-size="14" font-weight="600" fill="#898781" letter-spacing="1">NORMAL FORM</text>
  <text x="446" y="198" font-size="46" font-weight="700" fill="#0b0b0b">3NF</text>

  <rect x="810" y="110" width="360" height="110" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
  <rect x="810" y="110" width="6" height="110" rx="3" fill="#eda100"/>
  <text x="838" y="148" font-size="14" font-weight="600" fill="#898781" letter-spacing="1">KEY RELATIONSHIPS</text>
  <text x="836" y="198" font-size="46" font-weight="700" fill="#0b0b0b">8+</text>

  <!-- ER diagram panel -->
  <rect x="30" y="250" width="700" height="480" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
  <circle cx="48" cy="282" r="5" fill="#2a78d6"/>
  <text x="62" y="287" font-size="16" font-weight="700" fill="#0b0b0b">Entity-Relationship Map</text>

  <!-- relationship lines -->
  <g stroke="#c3c2b7" stroke-width="2" fill="none">
    <line x1="200" y1="360" x2="380" y2="360"/>   <!-- Customers - Sales -->
    <line x1="380" y1="393" x2="380" y2="470"/>   <!-- Sales - Payments -->
    <line x1="200" y1="393" x2="200" y2="560"/>   <!-- Customers - Services -->
    <line x1="200" y1="580" x2="380" y2="580"/>   <!-- Services - Cars(via) -->
    <line x1="560" y1="360" x2="450" y2="360"/>   <!-- Cars - Sales -->
    <line x1="560" y1="393" x2="560" y2="470"/>   <!-- Cars - Inventory -->
    <line x1="200" y1="640" x2="380" y2="640"/>   <!-- Customers - Warranty -->
    <line x1="560" y1="580" x2="560" y2="640"/>   <!-- Cars - Warranty link -->
  </g>

  <!-- entity boxes -->
  <g>
    <!-- Customers -->
    <rect x="120" y="330" width="80" height="60" rx="6" fill="#2a78d6"/>
    <text x="160" y="356" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Customers</text>
    <text x="160" y="374" font-size="10" fill="#cfe2fb" text-anchor="middle">CustomerID</text>
    <!-- Cars -->
    <rect x="560" y="330" width="80" height="60" rx="6" fill="#e34948"/>
    <text x="600" y="356" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Cars</text>
    <text x="600" y="374" font-size="10" fill="#fbd6d5" text-anchor="middle">CarID · VIN</text>
    <!-- Sales -->
    <rect x="380" y="330" width="80" height="60" rx="6" fill="#1baf7a"/>
    <text x="420" y="356" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Sales</text>
    <text x="420" y="374" font-size="10" fill="#d3f3e7" text-anchor="middle">SaleID</text>
    <!-- Payments -->
    <rect x="340" y="472" width="80" height="60" rx="6" fill="#4a3aa7"/>
    <text x="380" y="498" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Payments</text>
    <text x="380" y="516" font-size="10" fill="#ddd7f5" text-anchor="middle">PaymentID</text>
    <!-- Inventory -->
    <rect x="520" y="472" width="80" height="60" rx="6" fill="#eda100"/>
    <text x="560" y="498" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Inventory</text>
    <text x="560" y="516" font-size="10" fill="#fbecc8" text-anchor="middle">Stock</text>
    <!-- Services -->
    <rect x="120" y="552" width="80" height="56" rx="6" fill="#e87ba4"/>
    <text x="160" y="576" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Services</text>
    <text x="160" y="594" font-size="10" fill="#fadfeb" text-anchor="middle">ServiceID</text>
    <!-- Warranty -->
    <rect x="340" y="610" width="80" height="56" rx="6" fill="#5598e7"/>
    <text x="380" y="634" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Warranty</text>
    <text x="380" y="652" font-size="10" fill="#dbeafb" text-anchor="middle">WarrantyID</text>
    <!-- Dealerships -->
    <rect x="560" y="610" width="80" height="56" rx="6" fill="#256abf"/>
    <text x="600" y="634" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Dealerships</text>
    <text x="600" y="652" font-size="10" fill="#cfe2fb" text-anchor="middle">DealerID</text>
    <!-- Employees -->
    <rect x="120" y="440" width="80" height="56" rx="6" fill="#184f95"/>
    <text x="160" y="464" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Employees</text>
    <text x="160" y="482" font-size="10" fill="#cfe2fb" text-anchor="middle">EmployeeID</text>
  </g>
  <text x="50" y="712" font-size="11" fill="#898781">PK/FK-linked schema in 3NF — one integrated model across the sales-to-service lifecycle</text>

  <!-- Entity table panel -->
  <rect x="755" y="250" width="415" height="480" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
  <circle cx="773" cy="282" r="5" fill="#1baf7a"/>
  <text x="787" y="287" font-size="16" font-weight="700" fill="#0b0b0b">Entities &amp; Sample Rows</text>

  <!-- table header -->
  <line x1="775" y1="308" x2="1150" y2="308" stroke="#e1e0d9" stroke-width="1"/>
  <text x="785" y="330" font-size="12" font-weight="700" fill="#898781" letter-spacing="1">TABLE</text>
  <text x="1000" y="330" font-size="12" font-weight="700" fill="#898781" letter-spacing="1">SAMPLE ROWS</text>
  <line x1="775" y1="342" x2="1150" y2="342" stroke="#e1e0d9" stroke-width="1"/>

  <g font-size="13" fill="#0b0b0b">
    <text x="785" y="368">Customers</text>
    <rect x="1000" y="356" width="120" height="14" rx="4" fill="#2a78d6"/>
    <text x="1130" y="368" text-anchor="end" font-weight="700" fill="#184f95">120</text>

    <text x="785" y="404">Cars</text>
    <rect x="1000" y="392" width="90" height="14" rx="4" fill="#e34948"/>
    <text x="1130" y="404" text-anchor="end" font-weight="700" fill="#b23a39">85</text>

    <text x="785" y="440">Dealerships</text>
    <rect x="1000" y="428" width="24" height="14" rx="4" fill="#256abf"/>
    <text x="1130" y="440" text-anchor="end" font-weight="700" fill="#184f95">4</text>

    <text x="785" y="476">Employees</text>
    <rect x="1000" y="464" width="52" height="14" rx="4" fill="#184f95"/>
    <text x="1130" y="476" text-anchor="end" font-weight="700" fill="#184f95">38</text>

    <text x="785" y="512">Inventory</text>
    <rect x="1000" y="500" width="105" height="14" rx="4" fill="#eda100"/>
    <text x="1130" y="512" text-anchor="end" font-weight="700" fill="#b97c00">96</text>

    <text x="785" y="548">Sales</text>
    <rect x="1000" y="536" width="130" height="14" rx="4" fill="#1baf7a"/>
    <text x="1130" y="548" text-anchor="end" font-weight="700" fill="#0e7a55">140</text>

    <text x="785" y="584">Services</text>
    <rect x="1000" y="572" width="80" height="14" rx="4" fill="#e87ba4"/>
    <text x="1130" y="584" text-anchor="end" font-weight="700" fill="#c25680">72</text>

    <text x="785" y="620">Payments</text>
    <rect x="1000" y="608" width="128" height="14" rx="4" fill="#4a3aa7"/>
    <text x="1130" y="620" text-anchor="end" font-weight="700" fill="#4a3aa7">138</text>

    <text x="785" y="656">Warranty</text>
    <rect x="1000" y="644" width="70" height="14" rx="4" fill="#5598e7"/>
    <text x="1130" y="656" text-anchor="end" font-weight="700" fill="#2a78d6">64</text>
  </g>
  <text x="775" y="700" font-size="11" fill="#898781">Illustrative sample volumes to demonstrate schema &amp; queries</text>
  <text x="775" y="716" font-size="11" fill="#898781">— not production data.</text>

  <!-- footer -->
  <text x="1170" y="758" font-size="12" fill="#898781" text-anchor="end">Heta Chavda · Data Analytics Portfolio</text>
</svg>
