<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eda100"/>
      <stop offset="100%" stop-color="#2a78d6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <g stroke="#3a5a68" stroke-width="1" opacity="0.25">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- linked-table motif: schema boxes connected by relationship lines -->
  <g filter="url(#glow)">
    <!-- relationship edges draw in -->
    <g stroke-linecap="round" fill="none">
      <line x1="905" y1="95" x2="1000" y2="160" stroke="#5598e7" stroke-width="2.5" stroke-dasharray="130" stroke-dashoffset="130">
        <animate attributeName="stroke-dashoffset" from="130" to="0" begin="0.5s" dur="0.7s" fill="freeze"/>
      </line>
      <line x1="1000" y1="160" x2="905" y2="240" stroke="#1baf7a" stroke-width="2.5" stroke-dasharray="130" stroke-dashoffset="130">
        <animate attributeName="stroke-dashoffset" from="130" to="0" begin="0.8s" dur="0.7s" fill="freeze"/>
      </line>
      <line x1="1000" y1="160" x2="1105" y2="110" stroke="#eda100" stroke-width="2.5" stroke-dasharray="130" stroke-dashoffset="130">
        <animate attributeName="stroke-dashoffset" from="130" to="0" begin="1.1s" dur="0.7s" fill="freeze"/>
      </line>
    </g>
    <!-- table boxes pop in -->
    <g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.4s" fill="freeze"/>
        <rect x="835" y="62" width="72" height="46" rx="6" fill="#5598e7" stroke="#ffffff" stroke-width="1.5"/>
        <line x1="835" y1="78" x2="907" y2="78" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
        <line x1="835" y1="92" x2="907" y2="92" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" begin="0.6s" dur="0.4s" fill="freeze"/>
        <rect x="965" y="137" width="72" height="46" rx="6" fill="#1baf7a" stroke="#ffffff" stroke-width="1.5"/>
        <line x1="965" y1="153" x2="1037" y2="153" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
        <line x1="965" y1="167" x2="1037" y2="167" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" begin="0.9s" dur="0.4s" fill="freeze"/>
        <rect x="835" y="212" width="72" height="46" rx="6" fill="#eda100" stroke="#ffffff" stroke-width="1.5"/>
        <line x1="835" y1="228" x2="907" y2="228" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
        <line x1="835" y1="242" x2="907" y2="242" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" begin="1.2s" dur="0.4s" fill="freeze"/>
        <rect x="1075" y="82" width="72" height="46" rx="6" fill="#e34948" stroke="#ffffff" stroke-width="1.5"/>
        <line x1="1075" y1="98" x2="1147" y2="98" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
        <line x1="1075" y1="112" x2="1147" y2="112" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
      </g>
    </g>
    <!-- key pulse at join node -->
    <circle cx="1000" cy="160" r="6" fill="#ffffff">
      <animate attributeName="r" values="5;9;5" dur="1.6s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="70" y="96" width="8" height="128" rx="4" fill="url(#accent)"/>
  <text x="105" y="128" font-size="44" font-weight="700" fill="#ffffff">Database Design</text>
  <text x="105" y="172" font-size="23" font-weight="400" fill="#ffe6a8">Car Dealership System — Relational Schema in MySQL</text>

  <g font-size="16" font-weight="600">
    <rect x="105" y="200" width="140" height="34" rx="17" fill="#eda100" opacity="0.9"/>
    <text x="175" y="223" fill="#0b0b0b" text-anchor="middle">9 Entities</text>
    <rect x="257" y="200" width="140" height="34" rx="17" fill="#ffffff" opacity="0.12"/>
    <text x="327" y="223" fill="#cfeefc" text-anchor="middle">3NF Normalized</text>
    <rect x="409" y="200" width="190" height="34" rx="17" fill="#ffffff" opacity="0.12"/>
    <text x="504" y="223" fill="#cfeefc" text-anchor="middle">DDL · DML · DQL</text>
  </g>

  <text x="105" y="285" font-size="15" fill="#7fa9bd">MySQL · SQL · ERD   |   Heta Chavda — Data Analytics Portfolio</text>

  <rect x="-260" y="0" width="260" height="320" fill="url(#shine)" transform="skewX(-20)">
    <animate attributeName="x" from="-260" to="1300" dur="4.5s" begin="1.6s" repeatCount="indefinite"/>
  </rect>
</svg>
